<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitolen · Reparto — Mapa en vivo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181C; --ink-soft:#3A4148;
    --paper:#F7F4EE; --paper-dim:#EDE8DD; --paper-card:#FFFFFF;
    --accent:#E8590C; --accent-deep:#B8430A;
    --ok:#2F9E44; --ok-bg:#E7F6EB;
    --danger:#C92A2A; --danger-bg:#FBEAEA;
    --purple:#7137C9; --purple-bg:#F1EAFB;
    --line:#D8D2C2;
    --mono:'IBM Plex Mono', monospace; --sans:'IBM Plex Sans', sans-serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper-dim); font-family:var(--sans); color:var(--ink); }
  header{ background:var(--ink); color:var(--paper); padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header h1{ font-family:var(--mono); font-size:14px; letter-spacing:.1em; text-transform:uppercase; margin:0; font-weight:500; }
  header h1 span{ color:var(--accent); }
  .who{ font-family:var(--mono); font-size:11px; color:#9AA0A6; }
  main{ max-width:1200px; margin:0 auto; padding:24px; }
  .card{ background:var(--paper-card); border:1px solid var(--line); border-radius:10px; margin-bottom:18px; }
  .card h2{ font-size:13.5px; margin:0; padding:14px 18px; border-bottom:1px solid var(--line); }
  .card-body{ padding:16px 18px; }
  .field{ margin-bottom:0; }
  .field label{ display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  select{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-family:var(--sans); font-size:14px; background:var(--paper); }
  .login-wrap{ display:flex; justify-content:center; padding:60px 20px; }
  .login-card{ width:100%; max-width:360px; padding:32px 28px; text-align:center; }
  .login-card h3{ margin:0 0 20px 0; }
  input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-size:14px; margin-bottom:12px; background:var(--paper); }
  button{ font-family:var(--sans); font-weight:600; font-size:13.5px; border:none; border-radius:6px; padding:10px 16px; cursor:pointer; width:100%; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .msg{ font-size:12.5px; padding:10px 12px; border-radius:6px; margin-bottom:12px; }
  .msg-err{ background:var(--danger-bg); color:var(--danger); }
  .hidden{ display:none; }
  .map-grid{ display:grid; grid-template-columns:300px 1fr; gap:18px; }
  .op-row{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--paper-dim); cursor:pointer; }
  .op-row.active{ background:var(--paper); border-left:3px solid var(--accent); }
  .op-dot{ width:9px; height:9px; border-radius:50%; background:var(--ok); flex-shrink:0; }
  .op-name{ font-size:13px; font-weight:600; }
  .op-meta{ font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); }
  #mapa{ height:520px; border-radius:0 0 10px 10px; }
  .stop-list{ max-height:520px; overflow-y:auto; }
  .stop-item{ display:flex; align-items:center; gap:8px; padding:9px 16px; border-bottom:1px solid var(--paper-dim); font-size:12.5px; }
  .stop-num{ font-family:var(--mono); font-size:10px; font-weight:600; width:20px; height:20px; border-radius:50%; background:var(--paper-dim); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .stop-nombre{ flex:1; font-weight:600; }
  .badge{ font-family:var(--mono); font-size:9px; padding:2px 7px; border-radius:20px; flex-shrink:0; }
  .badge-pendiente{ background:var(--paper-dim); color:var(--ink-soft); }
  .badge-entregado{ background:var(--ok-bg); color:var(--ok); }
  .badge-visitado{ background:var(--purple-bg); color:var(--purple); }
  .badge-noentregado{ background:var(--danger-bg); color:var(--danger); }
  .live-pill{ font-family:var(--mono); font-size:10.5px; padding:6px 10px; border-radius:20px; background:var(--ink); color:var(--paper); display:inline-flex; align-items:center; gap:6px; margin:12px 16px 0 16px; }
  .pulse{ width:6px; height:6px; border-radius:50%; background:#4FDA7A; animation:pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
</style>
</head>
<body>

<header>
  <h1>Vitolen <span>·</span> Reparto — Mapa en vivo</h1>
  <div class="who" id="whoami"></div>
</header>

<main>

  <div id="vistaLogin" class="login-wrap">
    <div class="card login-card">
      <h3>Iniciar sesión</h3>
      <div id="loginMsg"></div>
      <div class="field" style="margin-bottom:12px;"><label>Email</label><input id="loginEmail" type="text"></div>
      <div class="field" style="margin-bottom:12px;"><label>Contraseña</label><input id="loginPass" type="password"></div>
      <button class="btn-primary" onclick="login()">Ingresar</button>
    </div>
  </div>

  <div id="vistaApp" class="hidden">
    <div class="card">
      <h2>Sucursal</h2>
      <div class="card-body">
        <div class="field"><label>Sucursal</label><select id="selectSucursal" onchange="cambiarSucursal()"></select></div>
      </div>
    </div>

    <div class="map-grid">
      <div class="card">
        <h2>Operadores en recorrido</h2>
        <div id="listaOperadores"></div>
      </div>
      <div class="card">
        <div id="mapa"></div>
        <div class="live-pill hidden" id="livePill"><span class="pulse"></span> EN VIVO</div>
      </div>
    </div>

    <div class="card hidden" id="cardParadas">
      <h2>Paradas del recorrido seleccionado</h2>
      <div class="stop-list" id="listaParadasSup"></div>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://mkrotthmdikzgviiklwu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rcm90dGhtZGlremd2aWlrbHd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDcxNjMsImV4cCI6MjEwMDcyMzE2M30.iJuZhIvYPtLg6Sxt9Z986KHesG3cYVe1KtSo0BcWw10";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let usuarioActual = null;
let perfilActual = null;
let sucursales = [];
let sucursalSeleccionada = null;
let recorridosActivos = [];
let recorridoSeleccionadoId = null;

let mapa = null;
let trazaPolyline = null;
let marcadorActual = null;
let marcadoresParadas = [];
let canalPosiciones = null;
let canalParadas = null;

async function login(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const msg = document.getElementById('loginMsg');
  msg.innerHTML = '';
  const { data, error } = await client.auth.signInWithPassword({ email, password: pass });
  if(error){ msg.innerHTML = `<div class="msg msg-err">${error.message}</div>`; return; }
  usuarioActual = data.user;
  await arrancar();
}

async function arrancar(){
  const { data: perfil, error } = await client.from('perfiles').select('*').eq('id', usuarioActual.id).single();
  if(error){ document.getElementById('loginMsg').innerHTML = `<div class="msg msg-err">${error.message}</div>`; return; }
  perfilActual = perfil;

  const { data: sucs } = await client.from('sucursales').select('*').order('nombre');
  sucursales = sucs || [];

  const selector = document.getElementById('selectSucursal');
  selector.innerHTML = '';
  if(perfilActual.rol === 'admin'){
    sucursales.forEach(s => { const o=document.createElement('option'); o.value=s.id; o.textContent=s.nombre; selector.appendChild(o); });
    selector.disabled = false;
    sucursalSeleccionada = sucursales.find(s => s.id === perfilActual.sucursal_id)?.id || sucursales[0]?.id;
  } else {
    const propia = sucursales.find(s => s.id === perfilActual.sucursal_id);
    const o = document.createElement('option'); o.value = propia?.id||''; o.textContent = propia?.nombre||'Sin sucursal'; selector.appendChild(o);
    selector.disabled = true;
    sucursalSeleccionada = propia?.id;
  }
  selector.value = sucursalSeleccionada;

  document.getElementById('whoami').textContent = `${perfilActual.nombre_completo} · ${perfilActual.rol.toUpperCase()}`;
  document.getElementById('vistaLogin').classList.add('hidden');
  document.getElementById('vistaApp').classList.remove('hidden');

  mapa = L.map('mapa').setView([-32.9468, -60.6393], 13); // centro por defecto: Rosario
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(mapa);

  await cargarOperadoresActivos();
}

async function cambiarSucursal(){
  sucursalSeleccionada = document.getElementById('selectSucursal').value;
  await cargarOperadoresActivos();
}

async function cargarOperadoresActivos(){
  const { data, error } = await client
    .from('recorridos')
    .select('*, perfiles!recorridos_operador_id_fkey(nombre_completo)')
    .eq('sucursal_id', sucursalSeleccionada)
    .eq('estado', 'en_curso')
    .order('created_at', { ascending:false });

  recorridosActivos = data || [];
  const cont = document.getElementById('listaOperadores');
  cont.innerHTML = '';

  if(error){ cont.innerHTML = `<div class="msg msg-err" style="margin:12px;">${error.message}</div>`; return; }
  if(recorridosActivos.length === 0){
    cont.innerHTML = '<p style="font-size:12.5px;color:var(--ink-soft);padding:14px 16px;">No hay recorridos en curso en esta sucursal.</p>';
    return;
  }

  for(const r of recorridosActivos){
    const { data: paradasR } = await client.from('paradas').select('estado').eq('recorrido_id', r.id);
    const total = paradasR?.length || 0;
    const resueltas = paradasR?.filter(p => p.estado !== 'pendiente').length || 0;

    const div = document.createElement('div');
    div.className = 'op-row' + (r.id === recorridoSeleccionadoId ? ' active' : '');
    div.innerHTML = `
      <div class="op-dot"></div>
      <div>
        <div class="op-name">${r.perfiles?.nombre_completo || '—'}</div>
        <div class="op-meta">Parada ${resueltas}/${total}</div>
      </div>
    `;
    div.onclick = () => seleccionarRecorrido(r.id);
    cont.appendChild(div);
  }

  if(!recorridoSeleccionadoId && recorridosActivos.length > 0){
    seleccionarRecorrido(recorridosActivos[0].id);
  }
}

async function seleccionarRecorrido(recorridoId){
  recorridoSeleccionadoId = recorridoId;
  document.getElementById('livePill').classList.remove('hidden');
  document.getElementById('cardParadas').classList.remove('hidden');

  if(canalPosiciones) client.removeChannel(canalPosiciones);
  if(canalParadas) client.removeChannel(canalParadas);
  if(trazaPolyline) mapa.removeLayer(trazaPolyline);
  if(marcadorActual) mapa.removeLayer(marcadorActual);
  marcadoresParadas.forEach(m => mapa.removeLayer(m));
  marcadoresParadas = [];

  await cargarTraza();
  await cargarParadasSup();
  await cargarOperadoresActivos();

  canalPosiciones = client.channel('pos-'+recorridoId)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'posiciones', filter:`recorrido_id=eq.${recorridoId}` }, (payload) => {
      agregarPuntoTraza(payload.new.lat, payload.new.lng);
    })
    .subscribe();

  canalParadas = client.channel('par-'+recorridoId)
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'paradas', filter:`recorrido_id=eq.${recorridoId}` }, () => {
      cargarParadasSup();
      cargarOperadoresActivos();
    })
    .subscribe();
}

async function cargarTraza(){
  const { data } = await client.from('posiciones').select('lat, lng').eq('recorrido_id', recorridoSeleccionadoId).order('registrado_en', { ascending:true });
  if(!data || data.length === 0) return;
  const puntos = data.map(p => [p.lat, p.lng]);
  trazaPolyline = L.polyline(puntos, { color: '#E8590C', weight: 3, dashArray: '1 8' }).addTo(mapa);
  const ultimo = puntos[puntos.length - 1];
  marcadorActual = L.circleMarker(ultimo, { radius: 8, color:'#fff', weight:2, fillColor:'#E8590C', fillOpacity:1 }).addTo(mapa);
  mapa.setView(ultimo, 15);
}

function agregarPuntoTraza(lat, lng){
  const punto = [lat, lng];
  if(!trazaPolyline){
    trazaPolyline = L.polyline([punto], { color:'#E8590C', weight:3, dashArray:'1 8' }).addTo(mapa);
  } else {
    trazaPolyline.addLatLng(punto);
  }
  if(marcadorActual) mapa.removeLayer(marcadorActual);
  marcadorActual = L.circleMarker(punto, { radius:8, color:'#fff', weight:2, fillColor:'#E8590C', fillOpacity:1 }).addTo(mapa);
  mapa.panTo(punto);
}

const COLOR_ESTADO = {
  entregado: '#2F9E44', visitado: '#7137C9',
  no_entregado_ausente: '#C92A2A', no_entregado_rechazado: '#C92A2A', no_entregado_direccion_incorrecta: '#C92A2A',
  reprogramado: '#B8720A',
};

function claseBadge(estado){
  if(estado === 'pendiente') return 'badge-pendiente';
  if(estado === 'entregado') return 'badge-entregado';
  if(estado === 'visitado') return 'badge-visitado';
  if(estado?.startsWith('no_entregado')) return 'badge-noentregado';
  return 'badge-pendiente';
}

async function cargarParadasSup(){
  const { data } = await client
    .from('paradas')
    .select('*, clientes(nombre)')
    .eq('recorrido_id', recorridoSeleccionadoId)
    .order('orden');

  marcadoresParadas.forEach(m => mapa.removeLayer(m));
  marcadoresParadas = [];

  const cont = document.getElementById('listaParadasSup');
  cont.innerHTML = '';
  (data || []).forEach(p => {
    const div = document.createElement('div');
    div.className = 'stop-item';
    div.innerHTML = `
      <div class="stop-num">${p.orden}</div>
      <div class="stop-nombre">${p.clientes?.nombre || '—'}</div>
      <span class="badge ${claseBadge(p.estado)}">${p.estado.replaceAll('_',' ')}</span>
    `;
    cont.appendChild(div);

    if(p.lat_registrada && p.lng_registrada){
      const color = COLOR_ESTADO[p.estado] || '#D8D2C2';
      const m = L.circleMarker([p.lat_registrada, p.lng_registrada], { radius:7, color:'#fff', weight:2, fillColor:color, fillOpacity:1 })
        .bindTooltip(p.clientes?.nombre || '')
        .addTo(mapa);
      marcadoresParadas.push(m);
    }
  });
}

document.getElementById('loginPass').addEventListener('keydown', (ev) => { if(ev.key === 'Enter') login(); });
</script>
</body>
</html>
