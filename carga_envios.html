<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitolen · Reparto — Carga de envíos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181C; --ink-soft:#3A4148;
    --paper:#F7F4EE; --paper-dim:#EDE8DD; --paper-card:#FFFFFF;
    --accent:#E8590C; --accent-deep:#B8430A;
    --ok:#2F9E44; --ok-bg:#E7F6EB;
    --danger:#C92A2A; --danger-bg:#FBEAEA;
    --line:#D8D2C2;
    --mono:'IBM Plex Mono', monospace; --sans:'IBM Plex Sans', sans-serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper-dim); font-family:var(--sans); color:var(--ink); }
  header{ background:var(--ink); color:var(--paper); padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header h1{ font-family:var(--mono); font-size:14px; letter-spacing:.1em; text-transform:uppercase; margin:0; font-weight:500; }
  header h1 span{ color:var(--accent); }
  .who{ font-family:var(--mono); font-size:11px; color:#9AA0A6; }
  main{ max-width:1100px; margin:0 auto; padding:24px; }
  .card{ background:var(--paper-card); border:1px solid var(--line); border-radius:10px; margin-bottom:18px; }
  .card h2{ font-size:13.5px; margin:0; padding:14px 18px; border-bottom:1px solid var(--line); }
  .card-body{ padding:16px 18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  input, select{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-family:var(--sans); font-size:14px; background:var(--paper); }
  input:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button{ font-family:var(--sans); font-weight:600; font-size:13.5px; border:none; border-radius:6px; padding:10px 16px; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-deep); }
  .btn-primary:disabled{ background:var(--line); cursor:not-allowed; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-danger{ background:var(--danger-bg); color:var(--danger); font-size:11px; padding:6px 10px; }
  .autocomplete{ position:relative; }
  .suggestions{ position:absolute; top:100%; left:0; right:0; background:var(--paper-card); border:1px solid var(--line); border-top:none; border-radius:0 0 6px 6px; max-height:220px; overflow-y:auto; z-index:10; }
  .suggestion{ padding:9px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--paper-dim); }
  .suggestion:hover{ background:var(--paper); }
  .suggestion .addr{ font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); }
  .suggestion.nuevo{ color:var(--accent); font-weight:600; }
  .selected-client{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:flex-start; }
  .selected-client .nombre{ font-weight:600; font-size:14px; }
  .selected-client .addr{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .selected-client button{ font-size:11px; padding:5px 9px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--line); }
  td{ padding:9px 10px; border-bottom:1px solid var(--paper-dim); }
  .badge{ font-family:var(--mono); font-size:10px; padding:2px 8px; border-radius:20px; background:var(--paper-dim); color:var(--ink-soft); }
  .msg{ font-size:12.5px; padding:10px 12px; border-radius:6px; margin-bottom:12px; }
  .msg-err{ background:var(--danger-bg); color:var(--danger); }
  .msg-ok{ background:var(--ok-bg); color:var(--ok); }
  .toggle-tipo{ flex:1; background:var(--paper); border:1px solid var(--line); color:var(--ink-soft); font-weight:600; padding:9px; border-radius:6px; }
  .toggle-tipo.activo{ background:var(--paper-card); border-color:var(--accent); color:var(--accent); }
  .badge-entrega{ background:#E7EEFB; color:#1C5FBF; }
  .badge-retiro{ background:#FBF0DD; color:#B8720A; }
  .hidden{ display:none; }
  .login-wrap{ display:flex; justify-content:center; padding:60px 20px; }
  .login-card{ width:100%; max-width:360px; padding:32px 28px; text-align:center; }
  .login-card h3{ margin:0 0 20px 0; }
</style>
</head>
<body>

<header>
  <h1>Vitolen <span>·</span> Reparto — Carga de envíos</h1>
  <div class="who" id="whoami"></div>
</header>

<main>

  <!-- LOGIN -->
  <div id="vistaLogin" class="login-wrap">
    <div class="card login-card">
      <h3>Iniciar sesión</h3>
      <div id="loginMsg"></div>
      <div class="field"><label>Email</label><input id="loginEmail" type="text"></div>
      <div class="field"><label>Contraseña</label><input id="loginPass" type="password"></div>
      <button class="btn-primary" style="width:100%" onclick="login()">Ingresar</button>
    </div>
  </div>

  <!-- APP -->
  <div id="vistaApp" class="hidden">

    <div class="card">
      <h2>Sucursal de trabajo</h2>
      <div class="card-body">
        <div class="field" style="margin-bottom:0;">
          <label>Sucursal</label>
          <select id="selectSucursal" onchange="cambiarSucursal()"></select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Cargar envío</h2>
      <div class="card-body">
        <div id="cargaMsg"></div>

        <div id="bloqueBusqueda">
          <div class="field autocomplete">
            <label>Cliente</label>
            <input id="buscarCliente" placeholder="Escribí el nombre del cliente…" oninput="buscarClientes()" autocomplete="off">
            <div id="sugerencias" class="suggestions hidden"></div>
          </div>
        </div>

        <div id="bloqueClienteSeleccionado" class="hidden">
          <div class="selected-client">
            <div>
              <div class="nombre" id="clienteNombre"></div>
              <div class="addr" id="clienteAddr"></div>
            </div>
            <button class="btn-ghost" onclick="quitarCliente()">Cambiar</button>
          </div>

          <div class="field">
            <label>Tipo de movimiento</label>
            <div style="display:flex; gap:8px;">
              <button type="button" id="btnTipoEntrega" class="toggle-tipo activo" onclick="elegirTipo('entrega')">Entrega</button>
              <button type="button" id="btnTipoRetiro" class="toggle-tipo" onclick="elegirTipo('retiro')">Retiro</button>
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label>Cantidad de bultos</label>
              <input id="bultos" type="number" min="1" value="1">
            </div>
            <div class="field">
              <label>Referencia / comprobante (escanear acá)</label>
              <input id="referencia" placeholder="Escaneá el remito…" onkeydown="if(event.key==='Enter'){event.preventDefault();agregarEnvio();}">
            </div>
          </div>
          <button class="btn-primary" onclick="agregarEnvio()">Agregar envío al lote</button>
        </div>

        <!-- alta de cliente nuevo -->
        <div id="bloqueClienteNuevo" class="hidden">
          <p style="font-size:12.5px;color:var(--ink-soft);margin-top:0;">No encontramos ese cliente. Completá los datos para darlo de alta:</p>
          <div class="field"><label>Nombre</label><input id="nuevoNombre"></div>
          <div class="row2">
            <div class="field"><label>Dirección</label><input id="nuevoDireccion"></div>
            <div class="field"><label>Teléfono</label><input id="nuevoTelefono"></div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn-primary" onclick="crearCliente()">Crear y seleccionar</button>
            <button class="btn-ghost" onclick="cancelarClienteNuevo()">Cancelar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Envíos cargados hoy <span class="badge" id="contadorEnvios">0</span></h2>
      <div class="card-body" style="padding:0;">
        <table>
          <thead><tr><th>Cliente</th><th>Tipo</th><th>Bultos</th><th>Referencia</th><th>Cargado por</th><th></th></tr></thead>
          <tbody id="tablaEnvios"></tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<script>
const SUPABASE_URL = "https://mkrotthmdikzgviiklwu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rcm90dGhtZGlremd2aWlrbHd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDcxNjMsImV4cCI6MjEwMDcyMzE2M30.iJuZhIvYPtLg6Sxt9Z986KHesG3cYVe1KtSo0BcWw10";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let usuarioActual = null;
let perfilActual = null;
let sucursales = [];
let sucursalSeleccionada = null;
let clienteSeleccionado = null;
let tipoMovimiento = 'entrega';
let debounceTimer = null;

function elegirTipo(tipo){
  tipoMovimiento = tipo;
  document.getElementById('btnTipoEntrega').classList.toggle('activo', tipo === 'entrega');
  document.getElementById('btnTipoRetiro').classList.toggle('activo', tipo === 'retiro');
}

async function login(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const msg = document.getElementById('loginMsg');
  msg.innerHTML = '';
  const { data, error } = await client.auth.signInWithPassword({ email, password: pass });
  if(error){
    msg.innerHTML = `<div class="msg msg-err">${error.message}</div>`;
    return;
  }
  usuarioActual = data.user;
  await cargarPerfilYArrancar();
}

async function cargarPerfilYArrancar(){
  const { data: perfil, error } = await client.from('perfiles').select('*').eq('id', usuarioActual.id).single();
  if(error){
    document.getElementById('loginMsg').innerHTML = `<div class="msg msg-err">No se pudo leer el perfil: ${error.message}</div>`;
    return;
  }
  perfilActual = perfil;

  const { data: sucs } = await client.from('sucursales').select('*').order('nombre');
  sucursales = sucs || [];

  const selector = document.getElementById('selectSucursal');
  selector.innerHTML = '';

  if(perfilActual.rol === 'admin'){
    sucursales.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id; opt.textContent = s.nombre;
      selector.appendChild(opt);
    });
    selector.disabled = false;
    sucursalSeleccionada = sucursales.find(s => s.id === perfilActual.sucursal_id)?.id || sucursales[0]?.id;
  } else {
    const propia = sucursales.find(s => s.id === perfilActual.sucursal_id);
    const opt = document.createElement('option');
    opt.value = propia?.id || ''; opt.textContent = propia?.nombre || 'Sin sucursal asignada';
    selector.appendChild(opt);
    selector.disabled = true;
    sucursalSeleccionada = propia?.id;
  }
  selector.value = sucursalSeleccionada;

  document.getElementById('whoami').textContent = `${perfilActual.nombre_completo} · ${perfilActual.rol.toUpperCase()}`;
  document.getElementById('vistaLogin').classList.add('hidden');
  document.getElementById('vistaApp').classList.remove('hidden');

  await cargarEnviosDelDia();
}

function cambiarSucursal(){
  sucursalSeleccionada = document.getElementById('selectSucursal').value;
  quitarCliente();
  cargarEnviosDelDia();
}

function buscarClientes(){
  clearTimeout(debounceTimer);
  const termino = document.getElementById('buscarCliente').value.trim();
  const caja = document.getElementById('sugerencias');
  if(termino.length < 2){ caja.classList.add('hidden'); caja.innerHTML=''; return; }

  debounceTimer = setTimeout(async () => {
    const { data, error } = await client
      .from('clientes')
      .select('id, nombre, direccion, telefono')
      .eq('sucursal_id', sucursalSeleccionada)
      .ilike('nombre', `%${termino}%`)
      .limit(8);

    caja.innerHTML = '';
    if(error){ caja.classList.add('hidden'); return; }

    data.forEach(c => {
      const div = document.createElement('div');
      div.className = 'suggestion';
      div.innerHTML = `<div>${c.nombre}</div><div class="addr">${c.direccion || 'sin dirección'}</div>`;
      div.onclick = () => seleccionarCliente(c);
      caja.appendChild(div);
    });

    const divNuevo = document.createElement('div');
    divNuevo.className = 'suggestion nuevo';
    divNuevo.textContent = `+ Crear cliente nuevo "${termino}"`;
    divNuevo.onclick = () => abrirClienteNuevo(termino);
    caja.appendChild(divNuevo);

    caja.classList.remove('hidden');
  }, 300);
}

function seleccionarCliente(c){
  clienteSeleccionado = c;
  document.getElementById('sugerencias').classList.add('hidden');
  document.getElementById('bloqueBusqueda').classList.add('hidden');
  document.getElementById('bloqueClienteNuevo').classList.add('hidden');
  document.getElementById('bloqueClienteSeleccionado').classList.remove('hidden');
  document.getElementById('clienteNombre').textContent = c.nombre;
  document.getElementById('clienteAddr').textContent = `${c.direccion || 'sin dirección'} · ${c.telefono || 'sin teléfono'}`;
  document.getElementById('bultos').value = 1;
  document.getElementById('referencia').value = '';
  elegirTipo('entrega');
  document.getElementById('referencia').focus();
}

function quitarCliente(){
  clienteSeleccionado = null;
  document.getElementById('buscarCliente').value = '';
  document.getElementById('bloqueBusqueda').classList.remove('hidden');
  document.getElementById('bloqueClienteSeleccionado').classList.add('hidden');
  document.getElementById('bloqueClienteNuevo').classList.add('hidden');
  document.getElementById('buscarCliente').focus();
}

function abrirClienteNuevo(nombrePrecargado){
  document.getElementById('sugerencias').classList.add('hidden');
  document.getElementById('bloqueClienteNuevo').classList.remove('hidden');
  document.getElementById('nuevoNombre').value = nombrePrecargado || '';
  document.getElementById('nuevoDireccion').value = '';
  document.getElementById('nuevoTelefono').value = '';
}

function cancelarClienteNuevo(){
  document.getElementById('bloqueClienteNuevo').classList.add('hidden');
}

async function crearCliente(){
  const nombre = document.getElementById('nuevoNombre').value.trim();
  const direccion = document.getElementById('nuevoDireccion').value.trim();
  const telefono = document.getElementById('nuevoTelefono').value.trim();
  const msg = document.getElementById('cargaMsg');

  if(!nombre){ msg.innerHTML = `<div class="msg msg-err">El nombre es obligatorio.</div>`; return; }

  const { data, error } = await client.from('clientes').insert({
    nombre, direccion: direccion || null, telefono: telefono || null,
    sucursal_id: sucursalSeleccionada, creado_por: usuarioActual.id
  }).select().single();

  if(error){ msg.innerHTML = `<div class="msg msg-err">${error.message}</div>`; return; }

  msg.innerHTML = '';
  document.getElementById('bloqueClienteNuevo').classList.add('hidden');
  seleccionarCliente(data);
}

async function agregarEnvio(){
  const bultos = parseInt(document.getElementById('bultos').value, 10) || 1;
  const referencia = document.getElementById('referencia').value.trim();
  const msg = document.getElementById('cargaMsg');

  if(!referencia){ msg.innerHTML = `<div class="msg msg-err">Falta la referencia del remito.</div>`; return; }

  const { error } = await client.from('envios').insert({
    cliente_id: clienteSeleccionado.id,
    sucursal_id: sucursalSeleccionada,
    referencia,
    cantidad_bultos: bultos,
    tipo_movimiento: tipoMovimiento,
    cargado_por: usuarioActual.id
  });

  if(error){ msg.innerHTML = `<div class="msg msg-err">${error.message}</div>`; return; }

  msg.innerHTML = `<div class="msg msg-ok">Envío agregado para ${clienteSeleccionado.nombre}.</div>`;
  quitarCliente();
  await cargarEnviosDelDia();
}

async function eliminarEnvio(id){
  if(!confirm('¿Eliminar este envío del lote?')) return;
  await client.from('envios').delete().eq('id', id);
  await cargarEnviosDelDia();
}

async function cargarEnviosDelDia(){
  const inicioHoy = new Date();
  inicioHoy.setHours(0,0,0,0);

  const { data, error } = await client
    .from('envios')
    .select('id, referencia, cantidad_bultos, tipo_movimiento, created_at, clientes(nombre), perfiles!envios_cargado_por_fkey(nombre_completo)')
    .eq('sucursal_id', sucursalSeleccionada)
    .is('parada_id', null)
    .gte('created_at', inicioHoy.toISOString())
    .order('created_at', { ascending: false });

  const tbody = document.getElementById('tablaEnvios');
  tbody.innerHTML = '';

  if(error){
    tbody.innerHTML = `<tr><td colspan="5" style="color:var(--danger)">${error.message}</td></tr>`;
    document.getElementById('contadorEnvios').textContent = '0';
    return;
  }

  document.getElementById('contadorEnvios').textContent = data.length;

  data.forEach(e => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${e.clientes?.nombre || '—'}</td>
      <td><span class="badge ${e.tipo_movimiento === 'retiro' ? 'badge-retiro' : 'badge-entrega'}">${e.tipo_movimiento === 'retiro' ? 'Retiro' : 'Entrega'}</span></td>
      <td>${e.cantidad_bultos}</td>
      <td style="font-family:var(--mono);font-size:11.5px;">${e.referencia}</td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--ink-soft);">${e.perfiles?.nombre_completo || '—'}</td>
      <td><button class="btn-danger" onclick="eliminarEnvio('${e.id}')">Eliminar</button></td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('loginPass').addEventListener('keydown', (ev) => { if(ev.key === 'Enter') login(); });
</script>
</body>
</html>
